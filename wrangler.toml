name = "voterdata-management"
compatibility_date = "2026-07-04"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

[vars]
VITE_APP_NAME = "VoterData Management"
APP_ORIGIN = "https://app.milindsagunnaik.in"
EXTRA_TRUSTED_ORIGINS = "https://voterdata-management.pages.dev"

[[d1_databases]]
binding = "DB"
database_name = "voterdata"
database_id = "bcf9ed27-9957-4868-9722-1597d6b15551"

# Control plane (Better Auth + orgs/workspaces/memberships/billing).
# Replace database_id with the id from `wrangler d1 create voterdata-platform`.
[[d1_databases]]
binding = "PLATFORM_DB"
database_name = "voterdata-platform"
database_id = "11111111-1111-4111-8111-111111111111"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "voter-photos"

[[r2_buckets]]
binding = "IMPORT_TEMP"
bucket_name = "import-temp"
